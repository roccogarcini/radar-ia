<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RADAR IA</title><style>:root{--p:#f4f0e7;--i:#111;--m:#69645d;--l:#cec7bb}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Georgia,serif}.w{max-width:1050px;margin:auto;padding:15px 16px 60px}.ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{border-bottom:3px solid #111;padding:10px 0}.brand{font-size:clamp(44px,9vw,78px);font-weight:900;letter-spacing:-4px;line-height:.9}.sub,.tag{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px;text-transform:uppercase}nav{display:flex;gap:20px;padding:12px 0;border-bottom:1px solid var(--l);position:sticky;top:0;background:rgba(244,240,231,.96);z-index:2}nav button{border:0;background:none;font-weight:800;padding:0;cursor:pointer}.active{text-decoration:underline;text-underline-offset:5px}.status{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--l);font-size:12px}.hero{padding:28px 0;border-bottom:2px solid #111}h1{font-size:clamp(40px,7vw,68px);line-height:.96;letter-spacing:-2px;margin:8px 0 12px}.summary{font-size:20px;line-height:1.42;max-width:830px}.grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid #111}.card{padding:22px 20px 22px 0}.card+.card{border-left:1px solid var(--l);padding-left:20px}.card h2{font-size:27px;line-height:1.06;margin:7px 0}.card p{font-size:17px;line-height:1.45}.actions{display:flex;gap:13px;flex-wrap:wrap;margin-top:14px;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.actions a{color:#111;text-decoration:none;border-bottom:1px solid #777;padding-bottom:2px}.actions a:hover{border-color:#111}.idea{margin:24px 0;background:#111;color:#fff;padding:22px}.idea h3{font-size:27px;margin:5px 0}.idea .actions a{color:#fff;border-color:#888}.idea .actions a:hover{border-color:#fff}.radarBox{margin:28px 0 34px;border-top:3px solid #111;border-bottom:2px solid #111;padding:18px 0}.radarHead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:6px}.radarHead h2{font-size:34px;margin:2px 0}.radarTabs{display:flex;gap:8px}.radarTabs button{border:1px solid #111;border-radius:999px;background:transparent;padding:7px 11px;font-weight:800;cursor:pointer}.radarTabs button.on{background:#111;color:#fff}.signalRow{display:grid;grid-template-columns:1fr auto;gap:16px;padding:15px 0;border-top:1px solid var(--l)}.signalRow h3{font-size:20px;line-height:1.08;margin:0 0 5px}.signalRow p{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--m);margin:0;max-width:790px}.signalRow .actions{margin-top:8px;font-size:11px}.bookmark{border:0;background:transparent;font-size:22px;cursor:pointer;line-height:1;padding:4px}.bookmark.saved{filter:saturate(1.4)}.emptySaved{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--m);padding:16px 0;border-top:1px solid var(--l)}.view{padding:25px 0}.hidden{display:none}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}input{width:min(390px,100%);padding:11px 14px;border:1px solid #aaa;border-radius:999px}.issue{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--l)}.date{font:900 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.issue h3{font-size:23px;margin:0 0 8px}.issue p{color:var(--m);margin:5px 0;line-height:1.4}.archiveSecondary{margin-top:18px;padding-top:12px;border-top:1px dashed var(--l)}.archiveSecondary .signalRow{padding:10px 0}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 24px}.pill{border:1px solid #111;background:none;border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:800}.pill:hover{background:#111;color:#fff}.topicGroup{margin:24px 0}.topicGroup h3{font-size:21px;margin:0 0 6px}footer{border-top:3px solid #111;padding-top:12px;color:var(--m);font-size:11px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:20px 0}.card+.card{border-left:0;border-top:1px solid var(--l);padding-left:0}.head{display:block}input{margin-top:10px}.issue{grid-template-columns:67px 1fr}.radarHead{display:block}.radarTabs{margin-top:12px}.signalRow{gap:8px}.signalRow h3{font-size:19px}}</style></head><body><main class="w"><header><div class="sub">INTELIGENCIA ARTIFICIAL · PERIÓDICO EJECUTIVO</div><div class="brand">RADAR IA</div></header><nav class="ui"><button class="active" onclick="view('today',this)">HOY</button><button onclick="view('archive',this)">ARCHIVO</button><button onclick="view('topics',this)">TEMAS</button><button onclick="searchNow(this)">BUSCAR</button></nav><div id="status" class="status ui"></div><section id="today"></section><section id="archive" class="view hidden"><div class="head"><div><div class="tag">Hemeroteca</div><h2 style="font-size:35px;margin:4px 0">Ediciones anteriores</h2></div><input id="q" class="ui" placeholder="Buscar agentes, MCP, DeepSeek..." oninput="archive()"></div><div id="issues"></div></section><section id="topics" class="view hidden"><div class="tag">Explorar el archivo</div><h2 style="font-size:35px;margin:4px 0">Temas</h2><div id="topicControls"></div><div id="topicResults"></div></section><footer class="ui">RADAR IA · Pocas noticias en portada. Todo el contexto en el archivo.</footer></main><script>let DATA,RADAR_FILTER='all';const SAVE_KEY='radarIA_savedSignals_v1';const labels={signal:'🔥 La señal del día',important:'👀 Importante saber',try:'🧪 Pruébalo hoy'};const GROUPS=[{title:'🤖 Por plataforma',items:[['ChatGPT',['chatgpt','openai','gpt','codex','astra']],['Claude',['claude','anthropic']],['Gemini',['gemini','google deepmind','deepmind']],['Grok',['grok','xai']],['Meta AI',['meta ai','meta','llama']]]},{title:'🧠 Por tecnología',items:[['Agentes',['agente','agentes','agentic']],['Modelos',['modelo','modelos']],['Coding',['coding','code','codex','software']],['Multimodal',['multimodal','voz','visión','video','audio']],['Open Source',['open source','open-source','open weight','open-weight']],['Skills / MCP',['skill','skills','mcp']]]},{title:'🌎 Por industria',items:[['Marketing',['marketing','seo','aeo','geo','campaña']],['Creatividad',['creativ','video','imagen','diseño']],['Safety',['safety','seguridad','alignment','eval']],['Chips / Compute',['chip','compute','gpu','inferencia','data center','energía']],['Regulación',['regulación','regulator','gobierno','ley','política ia']]]}];fetch('radar.json').then(r=>r.json()).then(d=>{DATA=d;renderToday();archive();topics()}).catch(()=>document.getElementById('today').innerHTML='<p>No se pudo cargar radar.json.</p>');function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function askUrl(s){let q=`Estoy leyendo esta noticia en RADAR IA: “${s.title}”. ${s.summary||''} Explícame qué significa, dame el contexto más reciente y ayúdame a entender sus implicaciones prácticas. Si la información cambió desde esta nota, actualízame.`;return 'https://chatgpt.com/?q='+encodeURIComponent(q)}function ideaUrl(e){let context=(e.stories||[]).map(s=>s.title).join(' | ');let q=`Quiero trabajar esta idea de contenido de RADAR IA: “${e.content_idea}”. Contexto de la edición: ${context}. Ayúdame a convertirla en una pieza atractiva para audiencia general. Dame: 3 ángulos posibles, el mejor hook, formato recomendado, estructura o guion, copy final y qué datos/fuentes conviene verificar antes de publicarla. Evita hype y hazla fácil de entender.`;return 'https://chatgpt.com/?q='+encodeURIComponent(q)}function actionHTML(s){let src=Array.isArray(s.sources)?s.sources:[];let source=src.find(x=>typeof x==='string'&&x.startsWith('http'));return `<div class="actions">${source?`<a href="${esc(source)}" target="_blank" rel="noopener">Fuente ↗</a>`:''}<a href="${askUrl(s)}" target="_blank" rel="noopener">Preguntar a ChatGPT ✦</a></div>`}function signalId(s,date=''){return s.id||('sig-'+date+'-'+String(s.title||'').toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi,'-').replace(/^-|-$/g,'').slice(0,70))}function savedSet(){try{return new Set(JSON.parse(localStorage.getItem(SAVE_KEY)||'[]'))}catch(e){return new Set()}}function saveSet(set){localStorage.setItem(SAVE_KEY,JSON.stringify([...set]))}function toggleSave(id){let set=savedSet();set.has(id)?set.delete(id):set.add(id);saveSet(set);renderRadarList();archive()}function secondaryHTML(s,date='',compact=false){let id=signalId(s,date),saved=savedSet().has(id);return `<div class="signalRow"><div><h3>${esc(s.title)}</h3><p>${esc(s.summary||'')}</p>${compact?'':actionHTML(s)}</div><button class="bookmark ${saved?'saved':''}" onclick="toggleSave('${esc(id)}')" title="${saved?'Quitar de guardadas':'Guardar para después'}">${saved?'🔖':'♡'}</button></div>`}function allSecondary(){let out=[];(DATA.editions||[]).forEach(e=>(e.secondary_signals||[]).forEach(s=>out.push({date:e.date,s,id:signalId(s,e.date)})));return out}function renderRadarList(){let box=document.getElementById('radarList');if(!box||!DATA)return;let e=DATA.editions[0],rows=(e.secondary_signals||[]).map(s=>({date:e.date,s,id:signalId(s,e.date)}));if(RADAR_FILTER==='saved'){let saved=savedSet();rows=allSecondary().filter(x=>saved.has(x.id))}box.innerHTML=rows.length?rows.map(x=>secondaryHTML(x.s,x.date,false)).join(''):`<div class="emptySaved">${RADAR_FILTER==='saved'?'Todavía no has guardado ninguna señal. Toca el marcador de una nota para conservarla aquí.':'Hoy no hay señales secundarias que valga la pena añadir.'}</div>`;let count=savedSet().size;let b=document.getElementById('savedTab');if(b)b.textContent='Guardadas '+(count?`(${count})`:'');document.querySelectorAll('.radarTabs button').forEach(x=>x.classList.remove('on'));let active=document.getElementById(RADAR_FILTER==='saved'?'savedTab':'allTab');if(active)active.classList.add('on')}function setRadarFilter(f){RADAR_FILTER=f;renderRadarList()}function renderToday(){let e=DATA.editions[0],s=e.stories;document.getElementById('status').innerHTML=`<span>${e.signals_reviewed} señales revisadas · <b>${s.length} seleccionadas</b></span><span>${e.date.split('-').reverse().join(' · ')}</span>`;let main=s[0],rest=s.slice(1,3);document.getElementById('today').innerHTML=`<div class="hero"><div class="tag">${labels[main.type]}</div><h1>${esc(main.title)}</h1><p class="summary">${esc(main.summary)}</p>${actionHTML(main)}</div><div class="grid">${rest.map(x=>`<article class="card"><div class="tag">${labels[x.type]}</div><h2>${esc(x.title)}</h2><p>${esc(x.summary)}</p>${actionHTML(x)}</article>`).join('')}</div>${e.content_idea?`<div class="idea"><div class="tag">💡 Idea para contenido</div><h3>${esc(e.content_idea)}</h3><div class="actions"><a href="${ideaUrl(e)}" target="_blank" rel="noopener">Trabajar en ChatGPT ✦</a></div></div>`:''}<section class="radarBox"><div class="radarHead"><div><div class="tag">Señales secundarias</div><h2>En el radar</h2></div><div class="radarTabs ui"><button id="allTab" onclick="setRadarFilter('all')">Hoy</button><button id="savedTab" onclick="setRadarFilter('saved')">Guardadas</button></div></div><p class="ui" style="color:var(--m);font-size:13px;margin:0 0 12px">Buenas señales que no entraron en portada. Léelas de reojo y guarda sólo las que te interesen.</p><div id="radarList"></div></section>`;renderRadarList()}function view(id,b){['today','archive','topics'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function searchNow(b){view('archive',b);setTimeout(()=>document.getElementById('q').focus(),30)}function storyHTML(s){return `<h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p>${actionHTML(s)}`}function archive(){if(!DATA)return;let q=(document.getElementById('q')?.value||'').toLowerCase();let es=DATA.editions.filter(e=>JSON.stringify(e).toLowerCase().includes(q));document.getElementById('issues').innerHTML=es.map(e=>`<div class="issue"><div class="date">${e.date.slice(8,10)} SEP</div><div>${(e.stories||[]).map(storyHTML).join('')}${(e.secondary_signals||[]).length?`<div class="archiveSecondary"><div class="tag">En el radar</div>${e.secondary_signals.map(s=>secondaryHTML(s,e.date,true)).join('')}</div>`:''}</div></div>`).join('')||'<p>No encontré coincidencias.</p>'}function topics(){document.getElementById('topicControls').innerHTML=GROUPS.map((g,gi)=>`<div class="topicGroup"><h3>${g.title}</h3><div class="pills ui">${g.items.map((x,ii)=>`<button class="pill" onclick="filterTopic(${gi},${ii})">${x[0]}</button>`).join('')}</div></div>`).join('');document.getElementById('topicResults').innerHTML='<p class="ui" style="color:var(--m)">Selecciona un tema para ver su evolución en el Radar.</p>'}function filterTopic(gi,ii){let [name,terms]=GROUPS[gi].items[ii],rows=[];DATA.editions.forEach(e=>{[...(e.stories||[]),...(e.secondary_signals||[])].forEach(s=>{let hay=(s.title+' '+(s.summary||'')+' '+(s.topics||[]).join(' ')).toLowerCase();if(terms.some(t=>hay.includes(t)))rows.push({date:e.date,s})})});document.getElementById('topicResults').innerHTML=`<h2 style="font-size:30px;margin-top:28px">${name}</h2>`+(rows.length?rows.map(r=>`<div class="issue"><div class="date">${r.date.slice(8,10)} SEP</div><div>${storyHTML(r.s)}</div></div>`).join(''):'<p class="ui">Todavía no hay notas archivadas en este tema.</p>')}</script></body></html>
