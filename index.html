<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RADAR IA</title><style>:root{--p:#f4f0e7;--i:#111;--m:#69645d;--l:#cec7bb}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Georgia,serif}.w{max-width:1050px;margin:auto;padding:15px 16px 60px}.ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{border-bottom:3px solid #111;padding:10px 0}.brand{font-size:clamp(44px,9vw,78px);font-weight:900;letter-spacing:-4px;line-height:.9}.sub,.tag{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px;text-transform:uppercase}nav{display:flex;gap:20px;padding:12px 0;border-bottom:1px solid var(--l);position:sticky;top:0;background:rgba(244,240,231,.96);z-index:2}nav button{border:0;background:none;font-weight:800;padding:0;cursor:pointer}.active{text-decoration:underline;text-underline-offset:5px}.status{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--l);font-size:12px}.hero{padding:28px 0;border-bottom:2px solid #111}h1{font-size:clamp(40px,7vw,68px);line-height:.96;letter-spacing:-2px;margin:8px 0 12px}.summary{font-size:20px;line-height:1.42;max-width:830px}.grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid #111}.card{padding:22px 20px 22px 0}.card+.card{border-left:1px solid var(--l);padding-left:20px}.card h2{font-size:27px;line-height:1.06;margin:7px 0}.card p{font-size:17px;line-height:1.45}.idea{margin:24px 0;background:#111;color:#fff;padding:22px}.idea h3{font-size:27px;margin:5px 0}.view{padding:25px 0}.hidden{display:none}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}input{width:min(390px,100%);padding:11px 14px;border:1px solid #aaa;border-radius:999px}.issue{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--l)}.date{font:900 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.issue h3{font-size:23px;margin:0 0 8px}.issue p{color:var(--m);margin:5px 0;line-height:1.4}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 24px}.pill{border:1px solid #111;background:none;border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:800}.pill:hover{background:#111;color:#fff}.topicGroup{margin:24px 0}.topicGroup h3{font-size:21px;margin:0 0 6px}footer{border-top:3px solid #111;padding-top:12px;color:var(--m);font-size:11px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:20px 0}.card+.card{border-left:0;border-top:1px solid var(--l);padding-left:0}.head{display:block}input{margin-top:10px}.issue{grid-template-columns:67px 1fr}}</style></head><body><main class="w"><header><div class="sub">INTELIGENCIA ARTIFICIAL · PERIÓDICO EJECUTIVO</div><div class="brand">RADAR IA</div></header><nav class="ui"><button class="active" onclick="view('today',this)">HOY</button><button onclick="view('archive',this)">ARCHIVO</button><button onclick="view('topics',this)">TEMAS</button><button onclick="searchNow(this)">BUSCAR</button></nav><div id="status" class="status ui"></div><section id="today"></section><section id="archive" class="view hidden"><div class="head"><div><div class="tag">Hemeroteca</div><h2 style="font-size:35px;margin:4px 0">Ediciones anteriores</h2></div><input id="q" class="ui" placeholder="Buscar agentes, MCP, DeepSeek..." oninput="archive()"></div><div id="issues"></div></section><section id="topics" class="view hidden"><div class="tag">Explorar el archivo</div><h2 style="font-size:35px;margin:4px 0">Temas</h2><div id="topicControls"></div><div id="topicResults"></div></section><footer class="ui">RADAR IA · Pocas noticias en portada. Todo el contexto en el archivo.</footer></main><script>let DATA;const labels={signal:'🔥 La señal del día',important:'👀 Importante saber',try:'🧪 Pruébalo hoy'};const GROUPS=[{title:'🤖 Por plataforma',items:[['ChatGPT',['chatgpt','openai','gpt','codex','astra']],['Claude',['claude','anthropic']],['Gemini',['gemini','google deepmind','deepmind']],['Grok',['grok','xai']],['Meta AI',['meta ai','meta','llama']]]},{title:'🧠 Por tecnología',items:[['Agentes',['agente','agentes','agentic']],['Modelos',['modelo','modelos']],['Coding',['coding','code','codex','software']],['Multimodal',['multimodal','voz','visión','video','audio']],['Open Source',['open source','open-source','open weight','open-weight']],['Skills / MCP',['skill','skills','mcp']] ]},{title:'🌎 Por industria',items:[['Marketing',['marketing','seo','aeo','geo','campaña']],['Creatividad',['creativ','video','imagen','diseño']],['Safety',['safety','seguridad','alignment','eval']],['Chips / Compute',['chip','compute','gpu','inferencia','data center','energía']],['Regulación',['regulación','regulator','gobierno','ley','política ia']]]}];fetch('radar.json').then(r=>r.json()).then(d=>{DATA=d;renderToday();archive();topics()}).catch(()=>document.getElementById('today').innerHTML='<p>No se pudo cargar radar.json.</p>');function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderToday(){let e=DATA.editions[0],s=e.stories;document.getElementById('status').innerHTML=`<span>${e.signals_reviewed} señales revisadas · <b>${s.length} seleccionadas</b></span><span>${e.date.split('-').reverse().join(' · ')}</span>`;let main=s[0],rest=s.slice(1,3);document.getElementById('today').innerHTML=`<div class="hero"><div class="tag">${labels[main.type]}</div><h1>${esc(main.title)}</h1><p class="summary">${esc(main.summary)}</p></div><div class="grid">${rest.map(x=>`<article class="card"><div class="tag">${labels[x.type]}</div><h2>${esc(x.title)}</h2><p>${esc(x.summary)}</p></article>`).join('')}</div>${e.content_idea?`<div class="idea"><div class="tag">💡 Idea para contenido</div><h3>${esc(e.content_idea)}</h3></div>`:''}`}function view(id,b){['today','archive','topics'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function searchNow(b){view('archive',b);setTimeout(()=>document.getElementById('q').focus(),30)}function archive(){if(!DATA)return;let q=(document.getElementById('q')?.value||'').toLowerCase();let es=DATA.editions.filter(e=>JSON.stringify(e).toLowerCase().includes(q));document.getElementById('issues').innerHTML=es.map(e=>`<div class="issue"><div class="date">${e.date.slice(8,10)} SEP</div><div>${e.stories.map((s,i)=>`<h3>${i===0?'':labels[s.type]+' · '}${esc(s.title)}</h3><p>${esc(s.summary)}</p>`).join('')}</div></div>`).join('')||'<p>No encontré coincidencias.</p>'}function topics(){document.getElementById('topicControls').innerHTML=GROUPS.map((g,gi)=>`<div class="topicGroup"><h3>${g.title}</h3><div class="pills ui">${g.items.map((x,ii)=>`<button class="pill" onclick="filterTopic(${gi},${ii})">${x[0]}</button>`).join('')}</div></div>`).join('');document.getElementById('topicResults').innerHTML='<p class="ui" style="color:var(--m)">Selecciona un tema para ver su evolución en el Radar.</p>'}function filterTopic(gi,ii){let [name,terms]=GROUPS[gi].items[ii],rows=[];DATA.editions.forEach(e=>e.stories.forEach(s=>{let hay=(s.title+' '+s.summary+' '+(s.topics||[]).join(' ')).toLowerCase();if(terms.some(t=>hay.includes(t)))rows.push({date:e.date,s})}));document.getElementById('topicResults').innerHTML=`<h2 style="font-size:30px;margin-top:28px">${name}</h2>`+(rows.length?rows.map(r=>`<div class="issue"><div class="date">${r.date.slice(8,10)} SEP</div><div><h3>${esc(r.s.title)}</h3><p>${esc(r.s.summary)}</p></div></div>`).join(''):'<p class="ui">Todavía no hay notas archivadas en este tema.</p>')}</script></body></html>
